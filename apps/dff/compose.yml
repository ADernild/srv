services:
  dr-dff-rs:
    image: adernild/dr-dff:latest
    container_name: dr-dff
    extends:
      file: ../../common/base.yml
      service: default
    restart: unless-stopped
    env_file: .env
    networks:
      - internal
      - public

networks:
  internal:
    external: true
  public:
    name: dff-public
